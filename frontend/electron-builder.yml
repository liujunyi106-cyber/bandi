# 功能：Electron 打包配置（@base docs/ADR.md ADR-42 / docs/前端设计规划.md §12）。
# Windows 优先（nsis）；壳内加载 electron/main.js + 前端构建产物 dist/；
# Python sidecar 生命周期与安装包瘦身 → P5-6（Day147-151）。
appId: com.bandi.desktop
productName: Bandi
copyright: Copyright © 2026 Bandi

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - dist/**/*
  - package.json
  # 渲染进程依赖已由 vite 打进 dist/，排除生产依赖在 asar 内的重复收集
  - "!node_modules/**"

# sidecar（Day147 C-5/C-6）：构建脚本 bandi/scripts/build-sidecar.py 先把
# PyInstaller 产物同步到 build/sidecar/bandi-sidecar/（ASCII 目标目录、
# 产物含 bandi-sidecar.exe + _internal/），这里整体作为 extraResources
# 打进 resources/sidecar/——与 electron/sidecar.ts 的 ② 号候选路径对齐。
# build/sidecar 不存在时需先跑构建脚本，否则打包报错（fail-fast 有意为之）。
extraResources:
  - from: build/sidecar
    to: sidecar

win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target: dmg
linux:
  target: AppImage
