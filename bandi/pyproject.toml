[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bandi"
version = "0.1.0"
description = "个人多 Agent 数字员工组织（组织向）——单人搭建/管理 AI 员工组织（角色/SOP/skills/模型 + 项目制），本体降级为知识组织层"
requires-python = ">=3.11"
authors = []
license = "MIT"

dependencies = [
    "fastapi>=0.110.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0.0",
    "pymupdf",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "pypdf",
    "tomli_w",
    "tiktoken>=0.5",
    "jsonschema>=4.20",
    "jinja2>=3.0",
    "python-pptx>=0.6",
    "pandas>=2.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "playwright>=1.40",
    "ruff==0.16.3",
    "pip-audit>=2.7",
]

# Phase 2 按需引入：
#   "tree-sitter>=0.26"      — Bash AST 安全检测
#   "tree-sitter-bash>=0.25" — Bash 语法树解析
# Phase 3 按需引入：
#   "chromadb>=0.4"         — RAG 文档检索向量存储（或改用 sqlite-vec）
#   "openai>=1.0"           — 仅用于 text-embedding-3 生成 Embedding（如需本地嵌入则不用）

[project.scripts]
bandi = "bandi.cli.app:app"

[tool.setuptools.packages.find]
include = ["bandi*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "BLE", "RUF100"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
markers = [
    "bandi_real_seen_path: 该测试自行隔离 seen 持久化路径（conftest 跳过 seen 路径 patch）",
    "heavy: 重型测试（子进程/LibreOffice/venv/网络/Playwright——日常快轨 -m \"not heavy\" 排除，收工全量跑）",
    "timing: 墙钟预算/并发临界区类测试——断言依赖真实耗时或并发时序，与全量 -n 4 争 CPU 时预算会被压爆（负载敏感，非缺陷）。verify.ps1 以独立低并发分组承载，仍必跑",
    "external_tool: 调用外部可执行程序（LibreOffice/soffice 等）的测试——子进程耗时随机器负载剧烈波动，verify.ps1 以独立低并发分组承载，仍必跑",
]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
