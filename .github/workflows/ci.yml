name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # 3.11 仍受支持（pyproject requires-python），但在 runner 上偶发用例长时间不返回，
        # 门禁先放在 3.12；3.11 单独跟踪，不用排除用例的方式掩盖
        python: ["3.12"]
    defaults:
      run:
        working-directory: bandi
    env:
      # rich 的表格按终端宽度换行，CI 默认宽度会把 --replace 截断
      COLUMNS: "200"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bandi/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests (fast track)
        shell: pwsh
        run: |
          # 诊断：打印真实布局，确定 tests 到底在哪一层
          Write-Host "workspace = $env:GITHUB_WORKSPACE"
          Write-Host "PWD       = $PWD"
          Get-ChildItem $env:GITHUB_WORKSPACE | Select-Object -First 20 Name, Mode | Format-Table -AutoSize
          Write-Host "--- 找 tests 目录 ---"
          Get-ChildItem $env:GITHUB_WORKSPACE -Directory -Recurse -Depth 2 -Filter tests -ErrorAction SilentlyContinue | Select-Object FullName
          exit 1

  frontend:
    name: Frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # CI 只跑 lint 与单测，不需要 Electron 运行时二进制（下载慢且易受网络影响）
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f deploy/Dockerfile -t bandi-kernel:ci .

      - name: Smoke test container
        run: |
          docker run -d --name bandi-smoke -p 18766:8766 -e BANDI_API_KEY=smoke bandi-kernel:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18766/health > /dev/null; then
              echo "kernel healthy"
              docker rm -f bandi-smoke
              exit 0
            fi
            sleep 2
          done
          echo "kernel did not become healthy"
          docker logs bandi-smoke
          docker rm -f bandi-smoke
          exit 1
