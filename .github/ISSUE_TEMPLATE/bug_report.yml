name: Bug report
description: 报告一个可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量给出**可复现**的最小步骤；涉及密钥时请先打码。

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 页面右下角或 `git rev-parse --short HEAD` 的结果
      placeholder: "例如 a9657f3"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的模块
      options:
        - 会话 / 单聊
        - 团队 / 群聊
        - 项目与工作项
        - 记忆与知识库
        - 工具调用 / 权限
        - 模型配置
        - 桌面壳 / 安装
        - 其它
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 看到 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关报错堆栈、`~/.bandi/logs/` 片段（请先脱敏）
      render: shell
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: "Windows 11 / Python 3.12 / Node 20 / pnpm 10"
    validations:
      required: true
